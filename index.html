<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오늘의 행운 뽑기</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body id="page">
<div class="game">
<h1>🍀오늘의 행운 뽑기🔮</h1>
<p class="guide">버튼을 눌러 오늘의 운세를 뽑아보세요!</p>
<div class="fortune-card" id="fortune-Card">
<p class="fortune-emoji" id="fortune-Emoji">🎁</p>
<p class="fortune-title" id="fortune-Title">아직 뽑지 않았어요</p>
<p class="fortune-message" id="fortune-Message">아래 버튼을 눌러 보세요</p>
</div>
<div class="lucky-row">
<div class="lucky-box">
<p class="lucky-label">행운의 색</p>
<p class="lucky-value"><span class="color-chip" id="color-Chip"></span> <span class="color-name" id="colorName">-</span></p>
</div>
<div class="lucky-box">
<p class="lucky-label">행운의 숫자</p>
<p class="lucky-value" id="luckyNumber">-</p>
</div>
</div>
<button type="button" class="draw-btn" id="draw-Btn">🔮운세 뽑기</button>
<p class="count-text" id="countText">지금까지 0번 뽑았어요.</p>
</div>
<script src="js/script.js"></script>
</body>
</html>
